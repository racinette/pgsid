schema: pgsid.regex-engine-profile/v1
engine: re2
baseline: re2-syntax

features:
  empty-expression: re2.emit-empty
  impossible-expression: unsupported
  literal: re2.escape-literal
  concatenation: re2.concatenate
  alternation: unsupported
  capturing-group: unsupported
  noncapturing-group: re2.wrap-noncapturing-group
  any-character-including-newline: unsupported
  any-character-excluding-newline: unsupported
  bracket-class: unsupported
  negated-bracket-class-including-newline: unsupported
  negated-bracket-class-excluding-newline: unsupported
  character-range: unsupported
  zero-or-more-quantifier: unsupported
  one-or-more-quantifier: unsupported
  zero-or-one-quantifier: unsupported
  exact-quantifier: unsupported
  at-least-quantifier: unsupported
  bounded-quantifier: unsupported
  greedy-preference: unsupported
  nongreedy-preference: unsupported
  beginning-of-string: re2.emit-beginning-of-string
  end-of-string: re2.emit-end-of-string
  beginning-of-line: unsupported
  end-of-line: unsupported
  beginning-of-word: unsupported
  end-of-word: unsupported
  word-boundary: unsupported
  non-word-boundary: unsupported
  positive-lookahead: unsupported
  negative-lookahead: unsupported
  positive-lookbehind: unsupported
  negative-lookbehind: unsupported
  backreference: unsupported
  case-sensitive: re2.no-op
  case-insensitive: unsupported
  unicode-code-points: re2.no-op
  substring-search: re2.no-op
