name: Set up toolchains
description: Pinned Node, pnpm, Go and Rust (optionally TinyGo), the PGlite extension tarball and locked dependencies.
inputs:
  tinygo:
    description: Install TinyGo, which only the asset build needs.
    default: 'false'
  assets:
    description: Download the generated assets the assets job uploaded.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 12.11.2
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.11.1
        cache: pnpm
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.2
        cache: false
    - name: Rust
      shell: bash
      run: |
        rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
        rustup default 1.99.0
    - name: TinyGo
      if: inputs.tinygo == 'true'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/tinygo.deb" https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo_0.42.0_amd64.deb
        echo "2082c4762fea6d5cc4cd1f4a243eaacf07b12f576717d4c6b74828bd163cb563  $RUNNER_TEMP/tinygo.deb" | sha256sum --check
        sudo dpkg -i "$RUNNER_TEMP/tinygo.deb"
    # The extension comes from an upstream CI artifact, which expires; the cache keeps a verified
    # copy while scheduled runs keep touching it.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: extension
      with:
        path: vendor/electric-sql-pglite-plpgsql-check-0.0.1.tgz
        key: plpgsql-check-98cc5ed8ffb9705ffe4388811a9d228fed75c7ee73ee828a1c75689298004413
    - name: PGlite extension
      if: steps.extension.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/fetch-plpgsql-check.sh
    - name: Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/*/target
          crates/*/target
          /tmp/pgsid-check-rust-transpiler-target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'tools/**/*.rs', 'crates/**/*.rs') }}
        restore-keys: cargo-${{ runner.os }}-
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.assets == 'true'
      with:
        name: check-assets
        path: src/codegen/go/assets
    # Generated beside the assets; the Unicode foundation suite reads its table from here.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.assets == 'true'
      with:
        name: check-tables
        path: /tmp
