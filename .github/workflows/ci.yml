# Per-change tier: static checks and the CHECK owner suites a change can affect. The full tier
# (full.yml) runs every suite and records the reach data the selection here reads.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    uses: ./.github/workflows/assets.yml
  static:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node node_modules/typescript/bin/tsc --noEmit -p .
      - run: node node_modules/eslint/bin/eslint.js .
      # The report is written synchronously and is large enough to fail with EAGAIN on the runner's non-blocking stdout.
      - run: |
          for command in lint 'build --check'; do
            status=0
            node node_modules/espalier/dist/src/cli.js $command --config tests/unit/query/espalier.config.yaml \
              --out "$RUNNER_TEMP/espalier-${command%% *}.txt" || status=$?
            cat "$RUNNER_TEMP/espalier-${command%% *}.txt"
            [ "$status" -eq 0 ] || exit "$status"
          done
      - run: >-
          node node_modules/prettier/bin/prettier.cjs --check . --ignore-path .gitignore
          --ignore-path .prettierignore --ignore-path tests/unit/query/.prettierignore
          --ignore-path tests/unit/query/sqlc-corpus/cases/.prettierignore
  affected:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/check-gate/reach
          key: check-reach-${{ github.sha }}
          restore-keys: check-reach-
      - name: Fast tier
        env:
          PGSID_CHECK_ASSETS: prebuilt
          PGSID_CHECK_MISSING_REACH: select
          PGSID_CHECK_WORKERS: '2'
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # A new branch's first push has no previous commit to compare with.
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE=HEAD~1; fi
          bash tools/check-rust/check-fast.sh "$BASE"
